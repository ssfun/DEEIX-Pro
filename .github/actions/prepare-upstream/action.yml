name: Prepare patched upstream
description: Check out a resolved DEEIX-Chat release and apply the Pro patch set.
inputs:
  upstream_sha:
    description: Resolved upstream commit (empty uses the local baseline)
    default: ''
  upstream_tag:
    description: Resolved upstream release tag (required with upstream_sha)
    default: ''
outputs:
  sha:
    description: Upstream commit SHA
    value: ${{ steps.resolve.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Resolve upstream manifest
      id: resolve
      shell: bash
      env:
        UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      run: python3 scripts/resolve_upstream.py --sha "$UPSTREAM_SHA" --tag "$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
    - name: Checkout upstream
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.resolve.outputs.repository }}
        ref: ${{ steps.resolve.outputs.sha }}
        path: .upstream/DEEIX-Chat
        persist-credentials: false
    - name: Verify release source and version
      shell: bash
      env:
        UPSTREAM_SHA: ${{ steps.resolve.outputs.sha }}
        UPSTREAM_TAG: ${{ steps.resolve.outputs.tag }}
      run: python3 scripts/resolve_upstream.py --sha "$UPSTREAM_SHA" --tag "$UPSTREAM_TAG" --verify-tree .upstream/DEEIX-Chat
    - name: Check and apply patches
      shell: bash
      run: |
        python3 scripts/apply_upstream_patches.py --check .upstream/DEEIX-Chat
        python3 scripts/apply_upstream_patches.py .upstream/DEEIX-Chat
