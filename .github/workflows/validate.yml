name: Validate patches
on:
  workflow_call:
    inputs:
      upstream_sha:
        type: string
        required: true
      upstream_tag:
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-upstream
        with:
          upstream_sha: ${{ inputs.upstream_sha }}
          upstream_tag: ${{ inputs.upstream_tag }}
      - name: Test release resolution
        run: python3 -m unittest discover -s tests -p 'test_resolve_upstream.py'
      - name: Test patch application and drift refusal
        run: python3 tests/test_apply.py .upstream/DEEIX-Chat
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: .upstream/DEEIX-Chat/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .upstream/DEEIX-Chat/backend/go.mod
          cache-dependency-path: .upstream/DEEIX-Chat/backend/go.sum
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install frontend dependencies
        working-directory: .upstream/DEEIX-Chat
        run: pnpm install --frozen-lockfile
      - name: Validate billing, generated API contracts and frontend types
        run: scripts/validate.sh .upstream/DEEIX-Chat
