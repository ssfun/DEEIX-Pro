name: Resolve latest upstream release
on:
  workflow_call:
    outputs:
      sha:
        description: Immutable upstream commit
        value: ${{ jobs.resolve.outputs.sha }}
      tag:
        description: Upstream release tag used as the image tag
        value: ${{ jobs.resolve.outputs.tag }}
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      tag: ${{ steps.upstream.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve latest stable release and its commit
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve_upstream.py --latest >> "$GITHUB_OUTPUT"
