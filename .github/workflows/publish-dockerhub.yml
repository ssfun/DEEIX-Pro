name: Publish Docker Hub
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (empty: sha-<commit>; latest is controlled below)'
        type: string
        default: ''
      publish_latest:
        description: Also update the latest tag
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dockerhub-publish
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  metadata:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Resolve Docker Hub image and tag
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
          INPUT_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN" || {
            echo '::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.'
            exit 1
          }
          image="${IMAGE_NAME:-${DOCKERHUB_USERNAME}/${GITHUB_REPOSITORY#*/}}"
          image="${image,,}"
          if [[ ! "$image" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo '::error::DOCKERHUB_IMAGE must be namespace/repository.'
            exit 1
          fi
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              tag="$GITHUB_REF_NAME"
            else
              tag="sha-${GITHUB_SHA:0:12}"
            fi
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || "$tag" == latest ]]; then
            echo '::error::Use a valid version tag; select publish_latest to update latest.'
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    name: Publish digest (${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-upstream
        id: upstream
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .upstream/DEEIX-Chat
          file: .upstream/DEEIX-Chat/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.deeix-pro.upstream.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha,scope=deeix-pro-${{ matrix.arch }}
          cache-to: type=gha,scope=deeix-pro-${{ matrix.arch }},mode=max
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Publish multi-platform manifest
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          TAG: ${{ needs.metadata.outputs.tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest == true }}
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/$arch")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          tags=(--tag "$IMAGE:$TAG")
          if [[ "$PUBLISH_LATEST" == true ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"
          echo "Published: \`$IMAGE:$TAG\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
