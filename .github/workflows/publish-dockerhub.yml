name: Publish Docker Hub
on:
  schedule:
    # 08:00 Asia/Shanghai (GitHub Actions cron uses UTC).
    - cron: '0 0 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Also update the latest tag
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dockerhub-publish
  cancel-in-progress: false
jobs:
  resolve:
    uses: ./.github/workflows/resolve-upstream.yml
  check:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check whether publication is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != schedule ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Query all pages; API/auth failures must stop rather than look like an update.
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          if grep -Fxq -- "$TAG" "$RUNNER_TEMP/published-tags"; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Already released: $TAG; skipping publication." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "New upstream release: $TAG; applying patches and publishing." >> "$GITHUB_STEP_SUMMARY"
          fi
  validate:
    needs: [resolve, check]
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      upstream_sha: ${{ needs.resolve.outputs.sha }}
      upstream_tag: ${{ needs.resolve.outputs.tag }}
  metadata:
    needs: [resolve, check]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/resolve-dockerhub-image
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          image: ${{ vars.DOCKERHUB_IMAGE }}
      - name: Check Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Configure the DOCKERHUB_TOKEN secret.'
            exit 1
          fi
  build:
    name: Publish digest (${{ matrix.arch }})
    needs: [resolve, metadata, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/resolve-dockerhub-image
        id: image
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          image: ${{ vars.DOCKERHUB_IMAGE }}
      - uses: ./.github/actions/prepare-upstream
        id: upstream
        with:
          upstream_sha: ${{ needs.resolve.outputs.sha }}
          upstream_tag: ${{ needs.resolve.outputs.tag }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .upstream/DEEIX-Chat
          file: .upstream/DEEIX-Chat/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.deeix-pro.upstream.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha,scope=deeix-pro-${{ matrix.arch }}
          cache-to: type=gha,scope=deeix-pro-${{ matrix.arch }},mode=max
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [resolve, metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/resolve-dockerhub-image
        id: image
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          image: ${{ vars.DOCKERHUB_IMAGE }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Publish multi-platform manifest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PUBLISH_LATEST: ${{ github.event_name == 'schedule' || inputs.publish_latest == true }}
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/$arch")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          tags=(--tag "$IMAGE:$TAG")
          if [[ "$PUBLISH_LATEST" == true ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"
          echo "Published: \`$IMAGE:$TAG\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: [resolve, publish]
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/resolve-dockerhub-image
        id: image
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          image: ${{ vars.DOCKERHUB_IMAGE }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
          PRO_SHA: ${{ github.sha }}
          IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          # Markdown backticks below are literal, not command substitutions.
          # shellcheck disable=SC2016
          {
            printf 'Automatically patched and validated upstream release **%s**.\n\n' "$TAG"
            printf -- '- Upstream commit: `%s`\n' "$UPSTREAM_SHA"
            printf -- '- Pro commit: `%s`\n' "$PRO_SHA"
            printf -- '- Docker image: `%s:%s` and `%s:latest`\n' "$IMAGE" "$TAG" "$IMAGE"
            printf -- '- Platforms: `linux/amd64`, `linux/arm64`\n'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo "$GH_REPO" --target "$PRO_SHA" \
            --title "DEEIX-Pro $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
